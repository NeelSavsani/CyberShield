<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — CyberShield</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" href="assets/favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body style="display:block;">

  <div class="auth-wrap">
    <div class="auth-card">

      <div class="auth-logo">
        <img src="assets/logo-icon.png" alt="CyberShield logo" />
        <span class="auth-logo-text">Cyber<span>Shield</span></span>
      </div>

      <h1 class="auth-title">Choose a new password</h1>
      <p class="auth-sub">Your new password must be at least 8 characters long.</p>

      <div class="alert-box alert-success" id="alert-success"></div>
      <div class="alert-box alert-error" id="alert-error"></div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="password">New password</label>
          <input class="form-input" type="password" id="password" name="password"
                 placeholder="Enter a new password" autocomplete="new-password" required />
          <p class="form-hint">Minimum 8 characters.</p>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm">Confirm new password</label>
          <input class="form-input" type="password" id="confirm" name="confirm"
                 placeholder="Re-enter your new password" autocomplete="new-password" required />
        </div>

        <button type="submit" class="btn-full" id="submit-btn">
          <span id="btn-label">Reset password</span>
        </button>
      </form>

      <p class="auth-footer-link">
        <a href="login.html">Back to log in</a>
      </p>

    </div>
  </div>

  <script src="js/firebase.js"></script>
  <script src="js/reset_password.js"></script>
</body>
</html>
