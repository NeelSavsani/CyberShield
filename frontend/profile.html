<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — CyberShield</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" href="assets/favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="index.html" class="sidebar-logo">
      <img src="assets/logo-icon.png" alt="CyberShield logo">
      <span class="sidebar-logo-text">Cyber<span>Shield</span></span>
    </a>

    <div class="sidebar-section">Main</div>
    <a href="dashboard.html" class="nav-item"><span class="nav-icon"><i class="fa-solid fa-house"></i></span> Dashboard</a>
    <a href="history.html" class="nav-item"><span class="nav-icon"><i class="fa-solid fa-clipboard-list"></i></span> History</a>
    <a href="reports.html" class="nav-item"><span class="nav-icon"><i class="fa-solid fa-chart-column"></i></span> Reports</a>

    <div class="sidebar-section">Account</div>
    <a href="profile.html" class="nav-item active"><span class="nav-icon"><i class="fa-solid fa-user"></i></span> Profile</a>
    <a href="settings.html" class="nav-item"><span class="nav-icon"><i class="fa-solid fa-gear"></i></span> Settings</a>

    <div class="sidebar-bottom">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">U</div>
        <div class="user-info">
          <div class="user-name" id="user-name">Loading…</div>
          <div class="user-role">Account</div>
        </div>
      </div>
      <a href="login.html" data-logout class="nav-item" style="margin-top:4px">
        <span class="nav-icon"><i class="fa-solid fa-right-from-bracket"></i></span> Log out
      </a>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <span class="topbar-title">Profile</span>
      <div class="topbar-right">
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">
          <i class="fa-solid fa-moon" id="theme-icon"></i>
        </button>
        <span style="font-size:13px; color:var(--gray)" id="save-status-top"></span>
      </div>
    </header>

    <div class="content">

      <div class="panel">
        <div class="panel-body" style="padding-top:22px;">
          <div class="profile-header">
            <div class="profile-avatar-lg" id="profile-avatar">U</div>
            <div>
              <div class="profile-name" id="profile-name">Loading…</div>
              <div class="profile-email" id="profile-email">—</div>
              <span class="badge badge-info profile-role-badge" id="profile-role">user</span>
            </div>
          </div>
        </div>
      </div>

      <div class="alert-box alert-success" id="alert-success" style="margin:0 0 16px;"></div>
      <div class="alert-box alert-error" id="alert-error" style="margin:0 0 16px;"></div>

      <div class="panel">
        <div class="panel-header"><span class="panel-title">Account Details</span></div>
        <div class="panel-body">
          <form id="profile-form" novalidate>
            <div class="form-row-2">
              <div class="form-group">
                <label class="form-label" for="first_name">First name</label>
                <input class="form-input" type="text" id="first_name" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="last_name">Last name</label>
                <input class="form-input" type="text" id="last_name" required />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="email_ro">Email address</label>
              <input class="form-input" type="email" id="email_ro" disabled style="background:var(--off-white); color:var(--gray);" />
              <p class="form-hint">Contact an administrator to change your registered email.</p>
            </div>
            <div class="save-bar">
              <span class="save-status" id="details-save-status">Saved <i class="fa-solid fa-check"></i></span>
              <button type="submit" class="action-btn-lg btn-report">Save changes</button>
            </div>
          </form>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header"><span class="panel-title">Change Password</span></div>
        <div class="panel-body">
          <form id="password-form" novalidate>
            <div class="form-row-2">
              <div class="form-group">
                <label class="form-label" for="current_password">Current password</label>
                <input class="form-input" type="password" id="current_password" autocomplete="current-password" />
              </div>
              <div class="form-group">
                <label class="form-label" for="new_password">New password</label>
                <input class="form-input" type="password" id="new_password" autocomplete="new-password" />
              </div>
            </div>
            <p class="form-hint" style="margin-bottom:14px;">Leave both fields blank to keep your current password.</p>
            <div class="save-bar">
              <button type="submit" class="action-btn-lg btn-back">Update password</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>

  <script src="js/firebase.js"></script>
  <script src="js/firebase-data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
